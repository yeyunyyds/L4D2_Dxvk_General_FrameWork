[frame_generation]
; Drop-in defaults. Close L4D2 before replacing files; Steam may stay open.
; enabled=0 skips the Vulkan Layer, FG log directory and monitor, leaving the
; v1.3.4 Bridge path as close to stock LDB as the compiled hooks permit.
enabled=1
hud=1
viewmodel=1
dynamic_models=1
; Experiment: include smaller FPB colour changes in the existing current-frame
; protection overlay. Requires dynamic_models=1. Set 0 for original behaviour.
fpb_protect=1
; Editable colour residual threshold for dynamic-model protection (0.001..0.5).
; auto preserves previous behaviour: 0.035 with FPB protection, else 0.08.
; Explicit numeric value overrides the FPB preset; lower = more protection.
dynamic_residual_threshold=auto
; Fraction of screen height where relaxed dynamic colour protection begins.
; 0.28 = lower 72% of screen; 1.0 disables lower-screen fallback.
; Valid: 0.0..1.0 (default 0.28).
first_person_fallback_start=0.28
; 0 = no dynamic four-neighbour / final-overlay 3x3 expansion.
; 1 = existing one-pixel expansions (default); only values 0/1 supported.
dynamic_mask_dilation=1
; Debug only: on GENERATED frames, paint the final protected/overlaid
; area (HUD + Viewmodel + dynamic pixels, including 3x3 dilation) pure white.
; Real frames and unprotected generated pixels remain unchanged.
mask_debug_white=0
; Experimental independent FPB proxy: approximates the local player body
; using camera-derived origin and three upright 3D bounding volumes.
; Requires no L4D2Visual/plugin. These six parameters HOT-RELOAD in-game.
; Not a true entity/pose detector. Disable when FPB body is not rendered.
; If no part of the 3D proxy projects into view, no FPB overlay is created.
fpb_projection_protect=0
; Offset in Source world units relative to horizontal camera yaw (NOT pitch).
; Positive forward/right/up = move proxy forward/right/up.
fpb_projection_forward=-13
fpb_projection_right=-1
fpb_projection_up=-1
; 0.5..2.5 scales horizontal widths of torso/legs; default 1.0.
fpb_projection_width=1.0
; 24..85 Source units; proxy origin is camera height minus this eye height.
; Standing survivor estimate ~64; crouch/other models may need adjustment.
fpb_projection_eye_height=64
content_probe=0
monitor=0
merge_submissions=1
auto_capture=0
capture_frames=4
hotkeys=1
pacing_ms=0
