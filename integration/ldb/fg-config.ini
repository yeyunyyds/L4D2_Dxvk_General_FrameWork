[frame_generation]
; Drop-in defaults. Close L4D2 before replacing files; Steam may stay open.
; enabled=0 skips the Vulkan Layer, FG log directory and monitor, leaving the
; v1.3.4 Bridge path as close to stock LDB as the compiled hooks permit.
enabled=1
hud=1
viewmodel=1
; Experimental bounded midpoint coverage between A/B Viewmodel colour masks.
; Hot-reload. Set 0 to return to the original A/B union.
viewmodel_sweep=1
; Maximum half-distance in pixels for opposing-mask bracketing (4..24).
viewmodel_sweep_radius=16
; Experimental FSR swapchain output: 1 = generated frames only.
; Hot-reload; real frames still display on FG pause / failure.
; Display rate is the source rate rather than the doubled paired-FG rate.
generated_only=0
dynamic_models=1
; Experiment: include smaller FPB colour changes in the existing current-frame
; protection overlay. Requires dynamic_models=1. Set 0 for original behaviour.
fpb_protect=1
; Editable colour residual threshold for dynamic-model protection (0.001..0.5).
; auto preserves previous behaviour: 0.035 with FPB protection, else 0.08.
; Explicit numeric value overrides the FPB preset; lower = more protection.
dynamic_residual_threshold=0.2
; Fraction of screen height where relaxed dynamic colour protection begins.
; 0.28 = lower 72% of screen; 1.0 disables lower-screen fallback.
; Valid: 0.0..1.0 (archived FPB baseline: 1.0).
first_person_fallback_start=1
; 0 = no dynamic four-neighbour / final-overlay 3x3 expansion.
; 1 = existing one-pixel expansions (default); only values 0/1 supported.
dynamic_mask_dilation=1
; Debug only: on GENERATED frames, paint the final protected/overlaid
; area (HUD + Viewmodel + dynamic pixels, including 3x3 dilation) pure white.
; Real frames and unprotected generated pixels remain unchanged.
mask_debug_white=0
; Experimental independent FPB proxy: approximates the local player body
; using camera-derived origin and three upright 3D bounding volumes.
; Requires no L4D2Visual/plugin. All projection parameters HOT-RELOAD in-game.
; Not a true entity/pose detector. Disable when FPB body is not rendered.
; If no part of the 3D proxy projects into view, no FPB overlay is created.
fpb_projection_protect=0
; Offset in Source world units relative to horizontal camera yaw (NOT pitch).
; Positive forward/right/up = move proxy forward/right/up.
fpb_projection_forward=-13
fpb_projection_right=-1
fpb_projection_up=-1
; 0.5..2.5 scales world-space horizontal widths of torso and legs.
fpb_projection_width=2
; 0.1..1.0 scales ONLY the projected torso rectangle's SCREEN width.
; 1.0 = original full width; 0.5 = half; 0.35 = aggressive side trimming.
; Unlike fpb_projection_width, does not alter position, height, or leg boxes.
; This specifically removes the broad white wings at the lower screen.
fpb_projection_torso_screen_width=0.5
; Per-box screen adjustments AFTER 3D projection (all HOT-RELOAD).
; Box 1 torso, box 2 left leg, box 3 right leg (character-local names).
; Width/height multipliers: 0.0 disables the box; 1.0 original; 0.1..3.0 valid.
; X/Y offsets are screen pixels at 1920x1080 reference resolution:
; +X moves right, +Y moves down. Scaled to actual output resolution.
; The legacy torso_screen_width multiplier above is applied to torso first.
; Torso / chest and abdomen. Archived tuned rectangle: width 1.4, height 0.7, y +200.
fpb_projection_torso_width=1.4
fpb_projection_torso_height=0.7
fpb_projection_torso_x=0
fpb_projection_torso_y=200
; Left leg box
fpb_projection_left_leg_width=0.0
fpb_projection_left_leg_height=1.0
fpb_projection_left_leg_x=0
fpb_projection_left_leg_y=0
; Right leg box
fpb_projection_right_leg_width=0.0
fpb_projection_right_leg_height=1.0
fpb_projection_right_leg_x=0
fpb_projection_right_leg_y=0
; 24..85 Source units; proxy origin is camera height minus this eye height.
; Standing survivor estimate ~64; crouch/other models may need adjustment.
fpb_projection_eye_height=64
content_probe=0
monitor=0
merge_submissions=1
auto_capture=0
capture_frames=4
hotkeys=1
pacing_ms=0
