[frame_generation]
; Drop-in defaults. Close L4D2 before replacing files; Steam may stay open.
; enabled=0 skips the Vulkan Layer, FG log directory and monitor, leaving the
; v1.3.4 Bridge path as close to stock LDB as the compiled hooks permit.
enabled=1
hud=1
viewmodel=1
dynamic_models=1
; Experiment: include smaller FPB colour changes in the existing current-frame
; protection overlay. Requires dynamic_models=1. Set 0 for original behaviour.
fpb_protect=1
; Debug only: on GENERATED frames, paint the final protected/overlaid
; area (HUD + Viewmodel + dynamic pixels, including 3x3 dilation) pure white.
; Real frames and unprotected generated pixels remain unchanged.
mask_debug_white=0
content_probe=0
monitor=0
merge_submissions=1
auto_capture=0
capture_frames=4
hotkeys=1
pacing_ms=0
