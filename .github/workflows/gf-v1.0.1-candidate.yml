name: Build GF v1.0.1 candidate (FPB baseline + generated-only)
on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gf-v1.0.1-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Preserve LF for pinned source hashes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Fast GF source and config regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_fg_dropin.py -v
          if ($LASTEXITCODE -ne 0) { throw "GF source/config tests failed before build" }
      - name: Build v1.0.1 candidate and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare_research.py --only dxvk vulkan_headers
          if ($LASTEXITCODE -ne 0) { throw "Dependency preparation failed" }
          python scripts/prepare_ldb_capture.py
          if ($LASTEXITCODE -ne 0) { throw "Host source preparation failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build_ldb_capture.ps1
          if ($LASTEXITCODE -ne 0) { throw "GF native build/package failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }
      - name: Test NVIDIA and existing Vulkan pNext feature-chain compatibility
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test_fg_device_feature_chain.ps1
          if ($LASTEXITCODE -ne 0) { throw "Vulkan feature-chain native smoke test failed" }
      - name: Upload experiment ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf-v1.0.1-candidate-${{ github.sha }}
          path: |
            .research/dist/ldb-host-capture-dev.zip
          if-no-files-found: warn
