name: Build LDB Host capture test package
on:
  push:
    branches: [ldb-host-capture]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ldb-host-capture-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve LF for pinned source hashes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build and verify native development trio
        id: native
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path native-build.log
          try {
            python scripts/prepare_research.py
            if ($LASTEXITCODE -ne 0) { throw 'Research dependency preparation failed' }
            python scripts/prepare_ldb_capture.py
            if ($LASTEXITCODE -ne 0) { throw 'Pinned LDB capture source preparation failed' }
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw 'Capture evidence tests failed' }
            & powershell.exe -NoProfile -File scripts/build_ldb_capture.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Native build or package verification failed' }
          } finally { Stop-Transcript }
      - name: Prepare build status ZIP
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.native.outcome }}
        run: |
          python scripts/package_capture_build_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Build status packaging failed' }
      - name: Upload build logs and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldb-host-capture-${{ github.sha }}
          path: .research/dist/ldb-host-capture-*.zip
          if-no-files-found: error
      - name: Publish ZIPs to download branch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin zip-host-capture
          if ($LASTEXITCODE -ne 0) { throw 'Download branch fetch failed' }
          git worktree add --detach ../capture-zip-publish origin/zip-host-capture
          if ($LASTEXITCODE -ne 0) { throw 'Download worktree creation failed' }
          python scripts/publish_capture_zips.py --worktree ../capture-zip-publish
          if ($LASTEXITCODE -ne 0) { throw 'ZIP publication failed' }
