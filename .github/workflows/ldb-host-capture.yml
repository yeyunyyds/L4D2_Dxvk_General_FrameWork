name: Build LDB Host capture test package
on:
  push:
    branches: [ldb-host-capture]
    paths-ignore:
      - integration/rt/**
      - scripts/*rt*
      - tests/rt_*
      - tests/test_rt_*
      - docs/research/rt-*
      - research/rt-*
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zip-host-capture-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve LF for pinned source hashes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build and verify native development trio
        id: native
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          function Invoke-Logged {
            param([string]$Name, [string]$Command)
            $log = "ci-logs\$Name.log"
            & cmd.exe /d /c "$Command > $log 2>&1"
            $result = $LASTEXITCODE
            if (Test-Path $log) { Get-Content -Encoding UTF8 $log }
            if ($result -ne 0) { throw "$Name failed: $result" }
          }
          Start-Transcript -Path native-build.log
          try {
            Invoke-Logged 'prepare-research' 'python scripts/prepare_research.py --only dxvk vulkan_headers'
            Invoke-Logged 'prepare-host' 'python scripts/prepare_ldb_capture.py'
            Invoke-Logged 'tests' 'python -m unittest discover -s tests -v'
            Invoke-Logged 'native-build' 'powershell.exe -NoProfile -File scripts/build_ldb_capture.ps1'
          } finally { Stop-Transcript }
      - name: Prepare build status ZIP
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.native.outcome }}
        run: |
          python scripts/package_capture_build_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Build status packaging failed' }
      - name: Upload build logs and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldb-host-capture-${{ github.sha }}
          path: .research/dist/ldb-host-capture-*.zip
          if-no-files-found: error
      - name: Publish ZIPs to download branch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin zip-host-capture
          if ($LASTEXITCODE -ne 0) { throw 'Download branch fetch failed' }
          git worktree add --detach ../capture-zip-publish origin/zip-host-capture
          if ($LASTEXITCODE -ne 0) { throw 'Download worktree creation failed' }
          python scripts/publish_capture_zips.py --worktree ../capture-zip-publish
          if ($LASTEXITCODE -ne 0) { throw 'ZIP publication failed' }
