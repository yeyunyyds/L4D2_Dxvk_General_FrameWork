name: Build GF Viewmodel swept-mask and synthetic-only experiment

on:
  push:
    branches:
      - experiment/viewmodel-sweep-synthetic-only-v1
    paths-ignore:
      - docs/**
      - tools/frame_generate_spirv.h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gf-viewmodel-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate provider shader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
          glslangValidator -V --target-env vulkan1.1 -S comp shaders/frame_generate.comp -o /tmp/frame_generate.spv
          spirv-val --target-env vulkan1.1 /tmp/frame_generate.spv
          python3 scripts/embed_spirv.py /tmp/frame_generate.spv tools/frame_generate_spirv.h --symbol frameGenerateSpirv --provenance shaders/frame_generate.comp
      - name: Source-level regression tests with regenerated shader
        run: python3 -m unittest discover -s tests -p test_fg_dropin.py -v
      - name: Archive the regenerated SPIR-V alongside GLSL source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/frame_generate_spirv.h
          if ! git diff --cached --quiet; then
            git commit -m "build: embed regenerated Viewmodel sweep SPIR-V [skip ci]"
            git push origin HEAD:experiment/viewmodel-sweep-synthetic-only-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: viewmodel-sweep-spirv
          path: tools/frame_generate_spirv.h

  build:
    runs-on: windows-2022
    needs: shaders
    timeout-minutes: 55
    steps:
      - name: Preserve pinned source hashes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewmodel-sweep-spirv
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Run GF tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_fg_dropin.py -v
          if ($LASTEXITCODE -ne 0) { throw "GF regression tests failed" }
      - name: Build experimental package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare_research.py --only dxvk vulkan_headers
          if ($LASTEXITCODE -ne 0) { throw "Dependency preparation failed" }
          python scripts/prepare_ldb_capture.py
          if ($LASTEXITCODE -ne 0) { throw "Host source preparation failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build_ldb_capture.ps1
          if ($LASTEXITCODE -ne 0) { throw "GF build failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "GF test suite failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gf-viewmodel-sweep-${{ github.sha }}
          path: .research/dist/ldb-host-capture-dev.zip
          if-no-files-found: warn
