name: Build RT protocol and observer foundation
on:
  push:
    branches: [ldb-host-capture]
    paths:
      - integration/rt/**
      - scripts/*rt*
      - tests/rt_*
      - tests/test_rt_*
      - .github/workflows/rt-foundation.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zip-host-capture-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve pinned source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Check system sky fixture before preparing dependencies
        id: sky_quick
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ci-rt-logs | Out-Null
          $rtSkyVs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (-not $rtSkyVs) { throw 'Visual Studio installation missing' }
          $rtSkyDev = Join-Path $rtSkyVs 'Common7\Tools\VsDevCmd.bat'
          @"
          @echo off
          call "$rtSkyDev" -arch=x64 -host_arch=x64 -vcvars_ver=14.29
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /O2 /MT /Iintegration/rt /Itests tests/rt_overlay_cases.cpp /Fe:ci-rt-logs/quick-sky.exe /Fo:ci-rt-logs/quick-sky.obj /link user32.lib bcrypt.lib > ci-rt-logs/quick-sky.log 2>&1
          if errorlevel 1 exit /b %errorlevel%
          ci-rt-logs\quick-sky.exe >> ci-rt-logs/quick-sky.log 2>&1
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ASCII ci-rt-logs/quick-sky.cmd
          & cmd.exe /d /c ci-rt-logs\quick-sky.cmd
          $rtSkyResult = $LASTEXITCODE
          Get-Content ci-rt-logs/quick-sky.log -ErrorAction SilentlyContinue
          if ($rtSkyResult -ne 0) { throw 'Early native sky fixture failed; see quick-sky.log' }
      - name: Execute coordinator and trace checks
        run: python -m unittest discover -s tests -p "test_rt_*.py" -v
      - name: Build x86 client and x64 Host with execution checks
        id: native
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ci-rt-logs | Out-Null
          & cmd.exe /d /c 'python scripts/prepare_rt_bridge.py > ci-rt-logs/prepare.log 2>&1'
          $result = $LASTEXITCODE
          Get-Content ci-rt-logs/prepare.log
          if ($result -ne 0) { throw 'RT source preparation failed' }
          & cmd.exe /d /c 'python scripts/prepare_rt_source_sdk.py > ci-rt-logs/sdk.log 2>&1'
          $result = $LASTEXITCODE
          Get-Content ci-rt-logs/sdk.log
          if ($result -ne 0) { throw 'RT SDK preparation failed' }
          & cmd.exe /d /c 'powershell.exe -NoProfile -File scripts/build_rt_foundation.ps1 > ci-rt-logs/native.log 2>&1'
          $result = $LASTEXITCODE
          Get-Content ci-rt-logs/native.log
          if ($result -ne 0) { throw 'RT native build failed' }
      - name: Package native evidence
        if: always()
        env:
          RT_BUILD_OUTCOME: ${{ steps.native.outcome }}
        run: python scripts/package_rt_build_status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt-foundation-${{ github.sha }}
          path: .research/dist/rt-foundation-build-status.zip
          if-no-files-found: error
      - name: Publish evidence ZIP
        if: always()
        run: python scripts/publish_rt_build_status.py
      - name: Package verified consumer observation entry
        id: observer_package
        if: steps.native.outcome == 'success'
        shell: powershell
        run: |
          & cmd.exe /d /c 'python scripts/package_rt_draw.py > ci-rt-logs/draw-package.log 2>&1'
          $result = $LASTEXITCODE
          Get-Content ci-rt-logs/draw-package.log
          if ($result -ne 0) { throw 'Observer package verification failed' }
      - name: Publish observer delivery evidence
        if: always()
        shell: python
        env:
          RT_NATIVE_OUTCOME: ${{ steps.native.outcome }}
          RT_OBSERVER_OUTCOME: ${{ steps.observer_package.outcome }}
        run: |
          import json, os, pathlib, subprocess, sys, zipfile
          p=pathlib.Path('.research/dist/rt-game-observe-build-status.zip')
          p.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(p,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('status.json',json.dumps({'commit':os.environ['GITHUB_SHA'],'native_outcome':os.environ['RT_NATIVE_OUTCOME'],'package_outcome':os.environ['RT_OBSERVER_OUTCOME'],'game_rt':'unrun','actual_game_observation':'unrun'}))
              for f in pathlib.Path('ci-rt-logs').glob('*.log'): z.write(f,'logs/'+f.name)
              index=pathlib.Path('.research/dist/rt-game-observe/publish-index.json')
              if index.is_file(): z.write(index,'publish-index.json')
              loader=pathlib.Path('.research/dist/rt-game-observe/rt-world-loader-validation.zip')
              if loader.is_file(): z.write(loader,'evidence/rt-world-loader-validation.zip')
          subprocess.run([sys.executable,'scripts/publish_rt_build_status.py','--package',str(p)],check=True)
      - name: Publish consumer observation ZIP
        if: success() && steps.native.outcome == 'success'
        run: python scripts/publish_rt_build_status.py --packages-directory .research/dist/rt-game-observe
